services:
  backend:
    build:
      context: .
      dockerfile: backend/TodoApi/Dockerfile
    container_name: todo-backend
    environment:
      ASPNETCORE_URLS: http://+:5200
      LOG_LEVEL: Information
      FRONTEND_URL: http://localhost:8080
      DB_PATH: /app/data/todo.db
      ADMIN_USERNAME: admin
      ADMIN_PASSWORD: admin
    ports:
      - "5200:5200"
    volumes:
      - backend-data:/app/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5200/"]
      interval: 10s
      timeout: 3s
      retries: 5

  frontend:
    build:
      context: frontend/TodoWeb
      dockerfile: Dockerfile
      args:
        VITE_APP_TITLE: Todo List
        VITE_API_BASE_URL: ""
        VITE_API_USERNAME: admin
        VITE_API_PASSWORD: admin
        VITE_LOG_LEVEL: info
    container_name: todo-frontend
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "8080:80"

volumes:
  backend-data:
